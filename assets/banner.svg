<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AuthByte">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="980" cy="80" r="180" fill="url(#orb)"/>
    <circle cx="180" cy="300" r="140" fill="url(#orb)"/>

    <!-- circuit traces -->
    <g fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round">
      <path d="M40 70 H180 V140 H260">
        <animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M40 110 H140 V200 H220">
        <animate attributeName="stroke-opacity" values="0.4;0.15;0.4" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M1160 280 H980 V210 H900">
        <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M1160 240 H1040 V160 H960">
        <animate attributeName="stroke-opacity" values="0.5;0.2;0.5" dur="3.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- nodes -->
    <g fill="#67e8f9">
      <circle cx="180" cy="70" r="3">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="140" r="3">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="200" r="3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="280" r="3">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="210" r="3">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- scan line -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#glow)" opacity="0.7">
      <animate attributeName="y" values="-10;370" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- brand mark -->
    <g transform="translate(90,118)">
      <rect x="0" y="0" width="78" height="78" rx="18" fill="#04101f" stroke="#22d3ee" stroke-width="2"/>
      <rect x="0" y="0" width="78" height="78" rx="18" fill="#22d3ee" opacity="0.08"/>
      <path d="M22 48 V30 H34 C42 30 46 34 46 39.5 C46 45 42 49 34 49 H22 Z M30 42 H34 C36.8 42 38 40.8 38 39.5 C38 38.2 36.8 37 34 37 H30 Z" fill="url(#neon)"/>
      <path d="M50 30 H58 V48 H50 Z" fill="url(#neon)" opacity="0.85"/>
      <circle cx="66" cy="24" r="4" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- title -->
    <text x="200" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="url(#neon)" letter-spacing="2">AuthByte</text>
    <text x="204" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#94a3b8" letter-spacing="4">BUILD · AUTH · SHIP</text>

    <!-- terminal chip -->
    <g transform="translate(200,236)">
      <rect width="420" height="42" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="18" cy="21" r="5" fill="#f87171"/>
      <circle cx="36" cy="21" r="5" fill="#fbbf24"/>
      <circle cx="54" cy="21" r="5" fill="#34d399"/>
      <text x="76" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#67e8f9">$ whoami ’ builder · tinkerer · night owl</text>
    </g>

    <!-- floating code tokens -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee" opacity="0.45">
      <text x="860" y="120">{'{ ok: true }'}</text>
      <text x="900" y="150">access_granted()</text>
      <text x="840" y="180">token.verify()</text>
      <text x="920" y="210">ship()</text>
    </g>

    <!-- bottom accent -->
    <rect x="0" y="356" width="1200" height="4" fill="url(#neon)" opacity="0.8"/>
  </g>
</svg>
